services:
  db:
    image: postgres:16-alpine
    container_name: otklik-db
    environment:
      POSTGRES_USER: otklik
      POSTGRES_PASSWORD: otklik
      POSTGRES_DB: otklik
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otklik -d otklik"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: otklik-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://otklik:otklik@db:5432/otklik?sslmode=disable"
      JWT_SECRET: "change-me-in-prod-super-secret-key"
      PORT: "8080"
      UPLOAD_DIR: "/data/uploads"
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: otklik-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
  uploads:
